services:
  db:
    image: postgres:17-alpine
    container_name: lottery-postgres
    environment:
      POSTGRES_USER: lottery
      POSTGRES_PASSWORD: lottery-local-dev
      POSTGRES_DB: lottery
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lottery-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lottery -d lottery"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  lottery-postgres:
