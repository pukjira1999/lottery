services:
  - type: web
    name: lottery-pukjira1999
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false

databases:
  - name: lottery-db
    databaseName: lottery
    user: lottery
    plan: 0.1c-256mb
    region: singapore
